# Project-scoped official n8n docs MCP. No secret is required.
[mcp_servers.n8n-docs]
url = "https://docs.n8n.io/~gitbook/mcp"
enabled = true
startup_timeout_sec = 30
tool_timeout_sec = 600

# Do not commit an instance URL or token.
# Store the Instance-level MCP API key as BWS secret N8N_MCP (alias N8N_MCP_ACCESS_TOKEN).
# bws run -- ./scripts/connect-n8n.sh https://YOUR-N8N-DOMAIN
# Authorization must stay a ${N8N_MCP} placeholder, never a literal token.
# Canary-first: Available in MCP only on a read-only canary, then /n8n-master-readiness.
